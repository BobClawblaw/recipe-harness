# Unlimited-OCR-2 (baidu, model_type unlimited-ocr), the bf16 release as published, on one 256 GB M5 Ultra Mac,
# TensorFold native Metal with the unlimited-ocr family (github.com/BobClawblaw/TensorFold branch unlimited-ocr): page
# images in, transcriptions out, one request at a time, greedy under the publisher's page guard. Its plan is `ocr`
# (pages and references from the recipe's ocr/ folder); the chat-model plans do not apply. Machine-specific values go
# in unlimited-ocr-2-m5.local.toml (git-ignored).
name = "unlimited-ocr-2-m5"
description = "Unlimited-OCR-2 bf16 as released, TensorFold native Metal (unlimited-ocr) on one M5 Ultra (131072-token window, one stream)"
model_name = "Unlimited-OCR-2, bf16"
hardware = "1x Apple M5 Ultra (256 GB unified), macOS"
engine = "TensorFold native, Metal"
url = "http://127.0.0.1:$port"
model = "Unlimited-OCR-2"
cwd = "$harness_dir"

[vars]
harness_dir = "CHANGE-ME: this checkout (up runs python3 -m harness.detach from it)"
engine_dir = "CHANGE-ME: the TensorFold checkout the served binary was built in (zig-out/native/bin/tensorfold-native)"
model_dir = "CHANGE-ME: the release as downloaded (baidu/Unlimited-OCR-2 at 04809669)"
ocr_dir = "CHANGE-ME: the recipe's ocr/ folder after pages.py and refs.py (pages/ and refs/)"
log_dir = "CHANGE-ME: a folder for the server's log"
port = "8896"
context = "131072"
max_pages = "64"

[commands]
up = "python3 -m harness.detach --log $log_dir/$model.log -- sh -c '$engine_dir/zig-out/native/bin/tensorfold-native serve $model_dir --name $model --port $port --context $context --max-tokens $context --vision --vision-max-images $max_pages --no-update-check 2>&1 | perl -ne \"\\$$|=1; print time(), q( ), \\$$_\"'"
# only this target's server on its port
down = "pkill -f 'tensorfold-native serve [^ ]*Unlimited-OCR-2[^ ]* .*--port $port( |$$)' ; sleep 3"
status = "pgrep -fl 'tensorfold-native serve [^ ]*Unlimited-OCR-2[^ ]* .*--port $port( |$$)'"
diagnose = "tail -5 $log_dir/$model.log"
server_log = "awk -v s=$since '$$1 >= s' $log_dir/$model.log"

[session]
up_retries = 1
up_timeout = 120
health_wait = 300
leave_up = false

[[identity]]
name = "engine_commit"
cmd = "git -C $engine_dir rev-parse --short HEAD"

[[identity]]
name = "binary_sha256"
cmd = "shasum -a 256 $engine_dir/zig-out/native/bin/tensorfold-native | cut -c1-64"

[[identity]]
name = "served_model"
cmd = "curl -s $url/v1/models"

[[identity]]
name = "chip"
cmd = "sysctl -n machdep.cpu.brand_string hw.memsize"

[[memory]]
name = "mac"
cmd = "memory_pressure | tail -1"

[features]
drafts = false
structured = false
sampling = false      # greedy only: the server refuses a temperature
vision_urls = false
capacity = false
max_concurrency = 1
thinking = false
prompt_cache = false
tools = false

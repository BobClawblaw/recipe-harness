# Unlimited-OCR-2 (baidu, model_type unlimited-ocr), the bf16 release as published, on one RTX 5090 (32 GB, Linux),
# TensorFold native CUDA with the unlimited-ocr family: page images in, transcriptions out, one request at a time,
# greedy under the publisher's page guard. Its plan is `ocr`. Machine-specific values go in
# unlimited-ocr-2-5090.local.toml (git-ignored).
name = "unlimited-ocr-2-5090"
description = "Unlimited-OCR-2 bf16 as released, TensorFold native CUDA (unlimited-ocr) on one RTX 5090 (131072-token window, one stream)"
model_name = "Unlimited-OCR-2, bf16"
hardware = "1x NVIDIA RTX 5090 (32 GB), Linux"
engine = "TensorFold native, CUDA"
url = "http://127.0.0.1:$port"
model = "Unlimited-OCR-2"
cwd = "$harness_dir"

[vars]
harness_dir = "CHANGE-ME: this checkout (up runs python3 -m harness.detach from it)"
engine_dir = "CHANGE-ME: the TensorFold checkout the served binary was built in (zig-out/native/bin/tensorfold-native)"
model_dir = "CHANGE-ME: the release as downloaded (baidu/Unlimited-OCR-2 at 04809669)"
ocr_dir = "CHANGE-ME: the recipe's ocr/ folder after pages.py and refs.py (pages/ and refs/)"
log_dir = "CHANGE-ME: a folder for the server's log"
port = "8896"
context = "131072"
max_pages = "64"

[commands]
up = "python3 -m harness.detach --log $log_dir/$model.log -- sh -c '$engine_dir/zig-out/native/bin/tensorfold-native serve $model_dir --name $model --port $port --context $context --max-tokens $context --chat-template $engine_dir/zig/src/families/uocr/chat_template.jinja --vision --vision-max-images $max_pages --no-update-check 2>&1 | perl -ne \"\\$$|=1; print time(), q( ), \\$$_\"'"
# only this target's server on its port
down = "pkill -f 'tensorfold-native serve [^ ]*Unlimited-OCR-2[^ ]* .*--port $port( |$$)' ; sleep 3"
status = "pgrep -fl 'tensorfold-native serve [^ ]*Unlimited-OCR-2[^ ]* .*--port $port( |$$)'"
diagnose = "tail -5 $log_dir/$model.log"
server_log = "awk -v s=$since '$$1 >= s' $log_dir/$model.log"

[session]
up_retries = 1
up_timeout = 120
health_wait = 300
leave_up = false

[[identity]]
name = "engine_commit"
cmd = "git -C $engine_dir rev-parse --short HEAD"

[[identity]]
name = "binary_sha256"
cmd = "sha256sum $engine_dir/zig-out/native/bin/tensorfold-native | cut -c1-64"

[[identity]]
name = "served_model"
cmd = "curl -s $url/v1/models"

[[identity]]
name = "gpu"
cmd = "nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader"

[[memory]]
name = "gpu"
cmd = "nvidia-smi --query-gpu=memory.used,memory.total --format=csv,noheader"

[features]
drafts = false
structured = false
sampling = false      # greedy only: the server refuses a temperature
vision_urls = false
capacity = false
max_concurrency = 1
thinking = false
prompt_cache = false
tools = false

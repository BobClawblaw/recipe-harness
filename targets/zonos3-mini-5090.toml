# ZONOS3 Mini (Zyphra/ZONOS3-Mini), the release as published, on one RTX 5090 (32 GB, Linux), TensorFold native CUDA
# with the zonos3 family (ashhart/TensorFold#3720) and its encoded reply formats: text to speech on
# /v1/audio/speech, the release's voices, cloning from a clip, one request at a time. Recipe:
# github.com/BobClawblaw/zonos3-mini-rtx-5090. Its plan is `speech`. Machine-specific values go in
# zonos3-mini-5090.local.toml (git-ignored).
name = "zonos3-mini-5090"
description = "ZONOS3 Mini as released, fp32 arithmetic, TensorFold native CUDA (zonos3) on one RTX 5090 (text to speech, one request at a time)"
model_name = "ZONOS3 Mini"
hardware = "1x NVIDIA RTX 5090 (32 GB), Linux"
engine = "TensorFold native, CUDA"
url = "http://127.0.0.1:$port"
model = "zonos3-mini"
cwd = "$harness_dir"

[vars]
harness_dir = "CHANGE-ME: this checkout (up runs python3 -m harness.detach from it)"
engine_dir = "CHANGE-ME: the TensorFold checkout the served binary was built in (the recipe's: ~/.cache/zonos3-mini/engine/<commit>)"
model_dir = "CHANGE-ME: the release as downloaded (Zyphra/ZONOS3-Mini)"
asr = "CHANGE-ME: a command that prints 'WER <number>' for the text and the WAV after it (the recipe's asr.py)"
log_dir = "CHANGE-ME: a folder for the server's log"
port = "30117"

[commands]
up = "python3 -m harness.detach --log $log_dir/$model.log -- $engine_dir/zig-out/native/bin/tensorfold-native serve $model_dir --name $model --host 127.0.0.1 --port $port --parallel 1 --no-update-check"
# only this target's server on its port
down = "pkill -f 'tensorfold-native serve .*--name $model .*--port $port( |$$)' ; sleep 3"
status = "pgrep -fl 'tensorfold-native serve .*--name $model .*--port $port( |$$)'"
diagnose = "tail -5 $log_dir/$model.log"
asr = "$asr $said $wav"

[session]
up_retries = 1
up_timeout = 120
health_wait = 300
leave_up = false

[[identity]]
name = "engine_commit"
cmd = "git -C $engine_dir rev-parse --short HEAD"

[[identity]]
name = "binary_sha256"
cmd = "sha256sum $engine_dir/zig-out/native/bin/tensorfold-native | cut -c1-64"

[[identity]]
name = "served_model"
cmd = "curl -s $url/v1/models"

[[identity]]
name = "gpu"
cmd = "nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader"

[[memory]]
name = "gpu"
cmd = "nvidia-smi --query-gpu=memory.used,memory.total --format=csv,noheader"

[[memory]]
name = "engine"
cmd = "curl -s $url/v1/memory"

[features]
drafts = false
structured = false
sampling = false
vision_urls = false
capacity = false
max_concurrency = 1
thinking = false
prompt_cache = false
tools = false

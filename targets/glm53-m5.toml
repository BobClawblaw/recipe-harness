# GLM-5.3-Flash MLX 4-bit on one M5 Ultra Mac (github.com/BobClawblaw/glm53-flash-mlx4bit-m5-ultra), driven over ssh.
# The Mac must serve the network (local.toml there: host = "0.0.0.0"). The quality suite and ruler are the qwen Spark
# recipe's, as the GLM recipe itself uses them: a checkout of that recipe on this machine (suite_dir) runs them
# against the Mac's endpoint. Machine-specific values go in glm53-m5.local.toml (git-ignored).
name = "glm53-m5"
description = "GLM-5.3-Flash MLX 4-bit, TensorFold native on one M5 Ultra Mac (three streams, the full 1M window)"
model_name = "GLM-5.3-Flash, MLX 4-bit"   # the report's model column
hardware = "1x Apple M5 Ultra (256 GB unified), macOS"
engine = "TensorFold native, Metal"
url = "http://$mac_host:8888"
model = "GLM-5.3-Flash-MLX-4bit"

[vars]
mac = "CHANGE-ME: ssh login of the Mac"
mac_host = "CHANGE-ME: the Mac's address as this machine reaches it"
recipe_dir = "CHANGE-ME: the GLM recipe checkout on the Mac"
suite_dir = "CHANGE-ME: a checkout of the qwen Spark recipe on this machine (quality/ and bench/)"
engine_dir = "CHANGE-ME: the TensorFold checkout whose native build runs the leaderboard suite (a release plus the board-suite commits)"

[commands]
up = "ssh $mac 'cd $recipe_dir && python3 -m mac up'"
down = "ssh $mac 'cd $recipe_dir && python3 -m mac down'"
status = "ssh $mac 'cd $recipe_dir && python3 -m mac status'"
diagnose = "ssh $mac 'cd $recipe_dir && python3 -m mac logs 2>&1 | tail -5'"
suite = "cd $suite_dir && python3 -m quality.suite --url $url --model $model --out $out $args"
ruler = "cd $suite_dir && python3 bench/ruler.py --url $url --model $model --concurrency $concurrency --json $out $args"

[session]
# no GPU lock: the Mac serves nothing else. After a memguard kill, `mac up` refuses for 15 minutes: one start only.
up_retries = 1
up_timeout = 1800
health_wait = 300
leave_up = true

[[identity]]
name = "recipe_commit"
cmd = "ssh $mac 'cd $recipe_dir && git rev-parse --short HEAD'"

[[identity]]
name = "patch_sha"
cmd = "ssh $mac \"cd $recipe_dir && python3 -c \\\"import tomllib; print(tomllib.load(open('recipe.toml', 'rb'))['engine']['patch_sha256'])\\\"\""

[[identity]]
name = "served_model"
cmd = "curl -s $url/v1/models"

[[memory]]
name = "mac"
cmd = "ssh $mac 'vm_stat | head -6; sysctl -n kern.memorystatus_vm_pressure_level'"

[features]
drafts = true
structured = false    # 400 on 1.2.5: backend glm-zig has no token grammar support (json_schema, tool_choice required/named)
sampling = true       # 1.2.5 samples (temperature, top_p, top_k, seed); 1.0.5 served a temperature greedily
vision_urls = false   # data URLs only
capacity = false      # three streams share the window; no capacity probe
max_concurrency = 3   # the ruler measures up to the recipe's three streams (parallel = 3)
thinking = true       # on by default, at effort High
prompt_cache = true

[leaderboard]
# tensorfold.dev/benchmarks: the public checkpoint by its repo ID (cached as a Hugging Face snapshot), run by the
# board-suite build of the engine on this Mac, once the recipe's own server has left the port
model = "TensorFold/GLM-5.3-Flash-MLX-4bit-MTP"
binary = "$engine_dir/zig-out/native/bin/tensorfold-native"
free = "! pgrep -f 'tensorfold-native serve [^ ]*GLM-5.3-Flash-MLX'"

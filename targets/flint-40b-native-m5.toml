# Recursive Flint (RecursiveSI/flint, 40B-A2.5B MoE: sliding and full attention with learned sinks), RecursiveSI's
# own MLX INT4 export (RecursiveSI/flint-int4: affine 4-bit groups of 64, 8-bit embeddings), served by TensorFold's
# native Metal engine (the flint family) on one 256 GB M5 Ultra Mac. No drafter. The server is a plain process, its
# output stamped with Unix seconds for server_log. The quality suite and ruler are the qwen Spark recipe's, from a
# local checkout (suite_dir). Machine-specific values go in flint-40b-native-m5.local.toml.
name = "flint-40b-native-m5"
description = "Recursive Flint 40B-A2.5B, MLX INT4 (g64), TensorFold native Metal on one M5 Ultra"
url = "http://127.0.0.1:$port"
model = "flint"
model_name = "Recursive Flint 40B-A2.5B, MLX INT4 (g64)"
hardware = "1x Apple M5 Ultra (256 GB unified), macOS"
engine = "TensorFold native, Metal"
cwd = "$harness_dir"

[vars]
harness_dir = "CHANGE-ME: this checkout (up runs python3 -m harness.detach from it)"
engine_dir = "CHANGE-ME: the TensorFold checkout the served binary was built in (zig-out/native/bin/tensorfold-native)"
model_dir = "CHANGE-ME: RecursiveSI/flint-int4, its files matching flint-int4.json's sha256s"
suite_dir = "CHANGE-ME: a checkout of the qwen Spark recipe on this machine (quality/ and bench/)"
log_dir = "CHANGE-ME: a folder for the server's log"
port = "8892"
context = "262144"
parallel = "4"
load_limit_gb = "48"                 # FLINT_LOAD_LIMIT_GB: weights, scratch and caches; the rest of the Mac stays free
prompt_cache_gib = "8"

[commands]
up = "python3 -m harness.detach --log $log_dir/$model.log -- sh -c 'FLINT_LOAD_LIMIT_GB=$load_limit_gb $engine_dir/zig-out/native/bin/tensorfold-native serve $model_dir --name $model --port $port --context $context --parallel $parallel --prompt-cache-gib $prompt_cache_gib --temperature 1.0 --top-p 0.95 --top-k 20 --no-update-check 2>&1 | perl -ne \"\\$$|=1; print time(), q( ), \\$$_\"'"
# only this target's server on its port: the same checkpoint may be served elsewhere on this Mac (another port)
down = "pkill -f 'tensorfold-native serve [^ ]*flint-int4 .*--port $port( |$$)' ; sleep 3"
status = "pgrep -fl 'tensorfold-native serve [^ ]*flint-int4 .*--port $port( |$$)'"
diagnose = "tail -5 $log_dir/$model.log"
server_log = "awk -v s=$since '$$1 >= s' $log_dir/$model.log"
suite = "cd $suite_dir && python3 -m quality.suite --url $url --model $model --out $out $args"
ruler = "cd $suite_dir && python3 bench/ruler.py --url $url --model $model --concurrency $concurrency --json $out $args"

[session]
up_retries = 1
up_timeout = 120
health_wait = 300                    # loads in about 2 s from a warm disk, then warms a prompt chunk
leave_up = false

[[identity]]
name = "engine_commit"
cmd = "git -C $engine_dir rev-parse --short HEAD"

[[identity]]
name = "binary_sha256"
cmd = "shasum -a 256 $engine_dir/zig-out/native/bin/tensorfold-native | cut -c1-64"

[[identity]]
name = "served_model"
cmd = "curl -s $url/v1/models"

[[identity]]
name = "chip"
cmd = "sysctl -n machdep.cpu.brand_string hw.memsize"

[[memory]]
name = "mac"
cmd = "memory_pressure | tail -1; sysctl -n vm.swapusage"

# Spark-X2.6-4B (XHToken, model_type spark2_5) MLX affine 8-bit on one RTX 4090 (24 GB), Windows, TensorFold native CUDA
# with the spark2_5 family (github.com/BobClawblaw/TensorFold branch spark25-cuda): the server is started and stopped as
# a process on this machine. The quality suite and ruler are the qwen Spark recipe's, from a local checkout (suite_dir).
# Machine-specific values go in spark-x26-4b-4090.local.toml (git-ignored; copy the .local.example.toml).
name = "spark-x26-4b-4090"
description = "Spark-X2.6-4B MLX 8-bit, TensorFold native CUDA (spark2_5) on one RTX 4090, Windows (32768-token window, 4 streams)"
model_name = "Spark-X2.6-4B, MLX 8-bit"   # the report's model column
hardware = "1x NVIDIA RTX 4090 (24 GB), Windows"
engine = "TensorFold native, CUDA"
url = "http://127.0.0.1:$port"
model = "spark"
cwd = "$harness_dir"

[vars]
harness_dir = "CHANGE-ME: this checkout (up runs python -m harness.detach from it)"
engine_dir = "CHANGE-ME: the TensorFold checkout the served binary was built in (zig-out/native/bin/tensorfold-native.exe)"
model_dir = "CHANGE-ME: the converted checkpoint folder (tools/zig/spark25_convert.py --bits 8), with forward slashes"
suite_dir = "CHANGE-ME: a checkout of the qwen Spark recipe on this machine (quality/ and bench/)"
log_dir = "CHANGE-ME: a folder for the server's log"
port = "8888"
context = "32768"
parallel = "4"

[commands]
up = "python -m harness.detach --log $log_dir/$model.out.log --err $log_dir/$model.log -- $engine_dir/zig-out/native/bin/tensorfold-native.exe serve $model_dir --name $model --port $port --context $context --parallel $parallel --no-update-check"
down = "taskkill /F /IM tensorfold-native.exe"
status = "tasklist /NH /FI \"IMAGENAME eq tensorfold-native.exe\""
diagnose = "powershell -NoProfile -Command \"Get-Content '$log_dir/$model.log' -Tail 5\""
suite = "cd /d $suite_dir && set PYTHONUTF8=1&& python -m quality.suite --url $url --model $model --out $out --long-max $context $args"   # UTF-8: HumanEval's problems on Windows; the needles within the window
ruler = "cd /d $suite_dir && python bench/ruler.py --url $url --model $model --concurrency $concurrency --json $out $args"

[session]
up_retries = 1
up_timeout = 120
health_wait = 300                    # loads in a few seconds from a warm disk
leave_up = true

[[identity]]
name = "engine_commit"
cmd = "git -C $engine_dir rev-parse --short HEAD"

[[identity]]
name = "binary_sha256"
cmd = "certutil -hashfile $engine_dir/zig-out/native/bin/tensorfold-native.exe SHA256 | findstr /V /I hash"

[[identity]]
name = "served_model"
cmd = "curl -s $url/v1/models"

[[identity]]
name = "gpu"
cmd = "nvidia-smi --query-gpu=name,driver_version --format=csv,noheader"

[[memory]]
name = "gpu"
cmd = "nvidia-smi --query-gpu=memory.used,memory.total --format=csv,noheader"

[features]
drafts = true         # copy drafts from the lane core (no draft head)
structured = false    # the source build has no libtfgrammar
sampling = true
vision_urls = false   # a text model
capacity = false      # 4 streams at a 32768-token window
max_concurrency = 4
thinking = true
prompt_cache = true

# Gemma 4 12B (Google's gemma-4-12B-it, text weights MLX 4-bit groups of 64 and the image embedder bf16, by TensorFold's
# gemma4_12b_convert.py) on one 256 GB M5 Ultra Mac, TensorFold native Metal (branch gemma4-12b, PR #975): Google's MTP
# assistant as the drafter, images (--vision), kept prompt states. The server is a plain process
# on this machine, its output stamped with Unix seconds for server_log. The quality suite and ruler are the qwen Spark
# recipe's (main), from a local checkout (suite_dir). Machine-specific values go in gemma4-12b-m5.local.toml.
name = "gemma4-12b-m5"
description = "Gemma 4 12B 4-bit (groups of 64), MTP assistant drafts, images, TensorFold native Metal on one M5 Ultra"
url = "http://127.0.0.1:$port"
model = "gemma4-12b"
model_name = "Gemma 4 12B, MLX 4-bit + MTP assistant"   # the report's model column
hardware = "1x Apple M5 Ultra (256 GB unified), macOS"
engine = "TensorFold native, Metal"
cwd = "$harness_dir"

[vars]
harness_dir = "CHANGE-ME: this checkout (up runs python3 -m harness.detach from it)"
engine_dir = "CHANGE-ME: the TensorFold checkout the served binary was built in (zig-out/native/bin/tensorfold-native)"
model_dir = "CHANGE-ME: google/gemma-4-12B-it at 707f0a3b through tools/zig/gemma4_12b_convert.py"
drafter_dir = "CHANGE-ME: google/gemma-4-12B-it-assistant at 46d4c6f1"
suite_dir = "CHANGE-ME: a checkout of the qwen Spark recipe on this machine (quality/ and bench/)"
log_dir = "CHANGE-ME: a folder for the server's log"
port = "8888"
context = "32768"
parallel = "4"

[commands]
up = "python3 -m harness.detach --log $log_dir/$model.log -- sh -c '$engine_dir/zig-out/native/bin/tensorfold-native serve $model_dir --name $model --port $port --context $context --parallel $parallel --drafter $drafter_dir --vision --no-update-check 2>&1 | perl -ne \"\\$$|=1; print time(), q( ), \\$$_\"'"
# only this target's server: other sessions serve other models from the same binary
down = "pkill -f 'tensorfold-native serve [^ ]*gemma-4-12B' ; sleep 3"
status = "pgrep -fl 'tensorfold-native serve [^ ]*gemma-4-12B'"
diagnose = "tail -5 $log_dir/$model.log"
server_log = "awk -v s=$since '$$1 >= s' $log_dir/$model.log"
suite = "cd $suite_dir && python3 -m quality.suite --url $url --model $model --out $out $args"
ruler = "cd $suite_dir && python3 bench/ruler.py --url $url --model $model --concurrency $concurrency --json $out $args"

[session]
up_retries = 1
up_timeout = 120
health_wait = 300                    # loads in about 12 s from a warm disk
leave_up = false

[[identity]]
name = "engine_commit"
cmd = "git -C $engine_dir rev-parse --short HEAD"

[[identity]]
name = "binary_sha256"
cmd = "shasum -a 256 $engine_dir/zig-out/native/bin/tensorfold-native | cut -c1-64"

[[identity]]
name = "served_model"
cmd = "curl -s $url/v1/models"

[[identity]]
name = "chip"
cmd = "sysctl -n machdep.cpu.brand_string hw.memsize"

[[memory]]
name = "mac"
cmd = "memory_pressure | tail -1; sysctl -n vm.swapusage"

[features]
drafts = true
structured = true
sampling = true
vision_urls = false   # data URLs only: the native server fetches nothing
capacity = false      # 32k-token streams by default
max_concurrency = 4
thinking = true
prompt_cache = true

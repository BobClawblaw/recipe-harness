description = "Quality, thinking off and on (2-3 hours): one stream fresh, the suite with thinking off (past its 1M long tasks), the harness's thinking problems, the suite's gsm8k and ifeval with thinking on"
restart = true

[[checks]]
type = "memory"
name = "memory-idle"

[[checks]]
type = "ruler"
label = "fresh"
concurrency = [1]

[[checks]]
type = "suite"
args = "--skip long-tasks snapshot soak"

[[checks]]
type = "thinking"
max_tokens = 8192

[[checks]]
type = "suite"
name = "suite-thinking"
args = "--only gsm8k ifeval --thinking"

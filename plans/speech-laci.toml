description = "LACI, short texts, the phoneme, start and pause tokens, and steering spans that follow the reading position, in text to speech (under a minute): a long passage under LACI, a short text with and without its filler, a pause marker, a start marker and a pronunciation group, two spans placed by the reading alone and under LACI, a reply held to a duration, each repeated whole and streamed; the settings that must change nothing; refusals. The server needs LACI heads, the short-text registry, a steering bundle and a release with the extra text rows"
restart = true

[[checks]]
type = "speech"
repeats = 3
cases = [
  { name = "watched", voice = "rupert", seed = 11, laci = true, input = "TensorFold now speaks with a second voice model. This is a longer passage, read at the default sampling settings, so that we can measure how fast the backbone and the codec run together on one graphics card, and how much memory the whole request needs from start to finish." },
  { name = "short", voice = "rupert", seed = 5, input = "Hello." },
  { name = "short-off", voice = "rupert", seed = 5, short_text = "off", input = "Hello." },
  { name = "pause", voice = "rupert", seed = 5, input = "Wait, what did you say just now?" },
  { name = "start", voice = "rupert", seed = 5, start_immediately = true, input = "Right away, I will see to it." },
  { name = "phones", voice = "rupert", seed = 5, input = "The quick brown fɒks jumps over the lazy dog." },
  { name = "follow", voice = "rupert", seed = 5, speaker_mode = "embedding", control_span_follow = "reading", control_spans = [{ start = 12, end = 20, controls = { "emphasis_nv_nodur.emphasis" = 2.0 } }, { start = 41, end = 54, controls = { "mood.arousal" = 1.5 } }], input = "By noon the wind had turned, so we walked the long way home along the sea wall." },
  { name = "follow-laci", voice = "rupert", seed = 5, speaker_mode = "embedding", laci = true, control_span_follow = "reading", control_spans = [{ start = 12, end = 20, controls = { "emphasis_nv_nodur.emphasis" = 2.0 } }, { start = 41, end = 54, controls = { "mood.arousal" = 1.5 } }], input = "By noon the wind had turned, so we walked the long way home along the sea wall." },
  { name = "duration", voice = "rupert", seed = 5, laci = true, duration_seconds = 3.6, condition_values = { speaking_rate = 12.0 }, input = "By noon the wind had turned, so we walked the long way home along the sea wall." },
]
same = [
  { name = "start-immediately-is-the-start-marker", a = { voice = "rupert", seed = 5, input = "Right away, I will see to it.", start_immediately = true }, b = { voice = "rupert", seed = 5, input = "Right away, I will see to it." }, other = { voice = "rupert", seed = 5, input = "Right away, I will see to it." } },
  { name = "laci-false-is-off", a = { voice = "rupert", seed = 5, input = "The harbor was quiet this morning.", laci = false }, b = { voice = "rupert", seed = 5, input = "The harbor was quiet this morning." } },
  { name = "follow-gate-defaults", a = { voice = "rupert", seed = 5, speaker_mode = "embedding", control_span_follow = "reading", control_spans = [{ start = 12, end = 20, controls = { "emphasis_nv_nodur.emphasis" = 2.0 } }, { start = 41, end = 54, controls = { "mood.arousal" = 1.5 } }], input = "By noon the wind had turned, so we walked the long way home along the sea wall." }, b = { voice = "rupert", seed = 5, speaker_mode = "embedding", control_span_follow = "reading", control_span_lead = 1.0, control_span_lag = 0.0, control_spans = [{ start = 12, end = 20, controls = { "emphasis_nv_nodur.emphasis" = 2.0 } }, { start = 41, end = 54, controls = { "mood.arousal" = 1.5 } }], input = "By noon the wind had turned, so we walked the long way home along the sea wall." }, other = { voice = "rupert", seed = 5, speaker_mode = "embedding", control_span_follow = "rate", control_spans = [{ start = 12, end = 20, controls = { "emphasis_nv_nodur.emphasis" = 2.0 } }, { start = 41, end = 54, controls = { "mood.arousal" = 1.5 } }], input = "By noon the wind had turned, so we walked the long way home along the sea wall." } },
  { name = "short-text-auto-is-the-default", a = { voice = "rupert", seed = 5, input = "Good morning.", short_text = "auto" }, b = { voice = "rupert", seed = 5, input = "Good morning." }, other = { voice = "rupert", seed = 5, input = "Good morning.", short_text = "off" } },
]
refusals = [
  { name = "laci-with-guidance", status = 400, body = { input = "x", laci = true, speaker_cfg_scale = 1.5 } },
  { name = "start-marker-not-first", status = 400, body = { input = "Not first." } },
  { name = "pause-marker-out-of-range", status = 400, body = { input = "Too long." } },
  { name = "group-not-closed", status = 400, body = { input = "An open group." } },
  { name = "phone-outside-the-inventory", status = 400, body = { input = "A 中 phone." } },
  { name = "short-text-bad-value", status = 400, body = { input = "Hi.", short_text = "maybe" } },
  { name = "follow-bad-value", status = 400, body = { input = "x", control_span_follow = "words" } },
  { name = "duration-without-laci", status = 400, body = { input = "x", duration_seconds = 2.0 } },
  { name = "duration-past-the-budget", status = 400, body = { input = "x", laci = true, duration_seconds = 500.0 } },
  { name = "follow-lag-out-of-range", status = 400, body = { input = "x", control_span_follow = "reading", control_span_lag = -5.0 } },
]
